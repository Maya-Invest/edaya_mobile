name: edaya_mobile
publish_to: none

environment:
  sdk: ^3.11.1

workspace:
  - apps/guardian
  - apps/teacher
  - packages/edaya_api_client
  - packages/edaya_auth
  - packages/edaya_shared
  - tooling/integration_tests

dev_dependencies:
  melos: ^8.0.0

dependency_overrides:
  cli_util: ^0.5.1

melos:
  command:
    bootstrap:
      runPubGetInParallel: true
  scripts:
    analyze:
      exec: dart analyze lib test
      description: Run static analysis on lib/ and test/ (skips build artifacts).
    test:
      exec: flutter test --exclude-tags integration
      description: Run unit and widget tests (skips live API integration tests).
    format:
      exec: dart format lib test
      description: Format Dart source in lib/ and test/ (skips build artifacts).
    fix:
      exec: bash ../../scripts/dart-fix-package.sh
      description: Apply automated dart fix suggestions in lib/ and test/.
    generated:update:
      run: bash scripts/generate-api-bindings.sh
      description: Regenerate edaya_api_client bindings from an OpenAPI document.
    generated:check:
      run: bash scripts/check-api-bindings-drift.sh
      description: Verify committed Dart bindings match spec/client-bindings.json.
    run:guardian:local:
      run: cd apps/guardian && flutter run --dart-define=AUTH_URL=http://10.0.2.2:9900 --dart-define=API_URL=http://10.0.2.2:9999
      description: Run guardian app against local API (Android emulator).
    run:guardian:legacy:local:
      run: echo "guardian_legacy is not a current app" && exit 1
      description: Removed legacy guardian app. Do not run.
    run:teacher:local:
      run: cd apps/teacher && flutter run --dart-define=AUTH_URL=http://10.0.2.2:9900 --dart-define=API_URL=http://10.0.2.2:9999
      description: Run teacher app against local Identity and school API (Android emulator).
    run:teacher:legacy:local:
      run: echo "teacher_legacy is not a current app" && exit 1
      description: Removed legacy teacher app. Do not run.
    run:guardian:staging:
      run: cd apps/guardian && flutter run
      description: Run guardian app (default staging API).
    run:guardian:legacy:staging:
      run: echo "guardian_legacy is not a current app" && exit 1
      description: Removed legacy guardian app. Do not run.
    run:teacher:staging:
      run: cd apps/teacher && flutter run
      description: Run teacher app (default staging API).
    run:teacher:legacy:staging:
      run: echo "teacher_legacy is not a current app" && exit 1
      description: Removed legacy teacher app. Do not run.
    brand:check:
      run: python3 scripts/brand-check.py
      description: Verify EDAYA tokens, assets, contrast and visual literals.
    brand:generate:
      run: python3 scripts/brand-tokens.py
      description: Generate local Dart brand tokens from the versioned snapshot.
    verify:
      run: |
        python3 scripts/release-contract.py --role mobile &&
        melos run brand:check &&
        melos run generated:check &&
        melos run analyze &&
        melos run test
      description: Run generated drift check, analysis, and tests.
    test:integration:
      run: |
        set -e
        cd tooling/integration_tests && EDAYA_INTEGRATION_TESTS=1 dart test --tags integration
        cd ../../apps/guardian && EDAYA_INTEGRATION_TESTS=1 flutter test test/integration --tags integration
        cd ../teacher && EDAYA_INTEGRATION_TESTS=1 flutter test test/integration --tags integration
      description: Run live API integration tests (requires local or remote API).
    screenshots:teacher:review:
      run: bash scripts/teacher-design-review.sh
      description: Generate teacher app screenshots for designer review (mock harness).
    screenshots:teacher:legacy:review:
      run: bash scripts/teacher-legacy-design-review.sh
      description: Generate archived teacher IA screenshots (requires API).
    screenshots:guardian:review:
      run: bash scripts/guardian-design-review.sh
      description: Generate guardian app screenshots for designer review.
    screenshots:guardian:legacy:review:
      run: bash scripts/guardian-legacy-design-review.sh
      description: Generate archived guardian IA screenshots (requires API).
    clean:flutter:
      exec: flutter clean
      description: Run flutter clean in all Flutter apps.
    android:keystore:create:
      run: bash scripts/create-android-keystore.sh
      description: Create upload keystore and key.properties for Play Store signing.
    build:play:aab:
      run: bash scripts/build-play-aab.sh
      description: Build release-signed AABs for guardian and teacher (Google Play).
    build:guardian:play:
      run: bash scripts/build-play-aab.sh guardian
      description: Build guardian Play Store AAB.
    build:teacher:play:
      run: bash scripts/build-play-aab.sh teacher
      description: Build teacher Play Store AAB.
