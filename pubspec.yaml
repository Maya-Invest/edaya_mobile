name: edaya_mobile
publish_to: none

environment:
  sdk: ^3.11.1

workspace:
  - apps/guardian
  - apps/guardian_v2
  - apps/teacher
  - apps/teacher_v2
  - packages/edaya_api_client
  - packages/edaya_auth
  - packages/edaya_shared
  - tooling/integration_tests
  - tooling/repo

dev_dependencies:
  melos: ^8.0.0

dependency_overrides:
  cli_util: ^0.5.1

melos:
  command:
    bootstrap:
      runPubGetInParallel: true
  scripts:
    analyze:
      exec: dart analyze lib test
      description: Run static analysis on lib/ and test/ (skips build artifacts).
    test:
      exec: flutter test --no-pub --exclude-tags 'integration || staging || design-review'
      packageFilters:
        ignore: edaya_repo
      description: Run unit and widget tests, excluding live APIs and screenshot generation.
    format:
      exec: dart format lib test
      description: Format Dart source in lib/ and test/ (skips build artifacts).
    fix:
      exec: dart run edaya_repo:repo maintenance fix
      description: Apply automated dart fix suggestions in lib/ and test/.
    generated:update:
      run: dart run edaya_repo:repo generate client
      description: Regenerate edaya_api_client bindings from an OpenAPI document.
    generated:check:
      run: dart run edaya_repo:repo check
      description: Verify the prepared client against its acquired backend commit and checksums.
    brand:generate:
      run: dart run edaya_repo:repo generate brand
      description: Generate local Dart brand tokens from the versioned snapshot.
    verify:
      run: dart run edaya_repo:repo ci verify
      description: Verify prepared clients, brand, workflows, tooling and application tests.
