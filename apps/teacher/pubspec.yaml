name: edaya_teacher
description: Edaya mobile app for teachers and classroom workflows.
publish_to: none
resolution: workspace

version: 1.0.0+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  edaya_api_client:
    path: ../../packages/edaya_api_client
  edaya_auth:
    path: ../../packages/edaya_auth
  edaya_shared:
    path: ../../packages/edaya_shared
  go_router: ^17.3.0
  image: ^4.5.4
  image_picker: ^1.2.0
  http: ^1.6.0
  intl: any
  levit_flutter: ^0.0.9
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.42
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  signature: ^6.4.0

dev_dependencies:
  image_picker_platform_interface: ^2.11.1
  flutter_secure_storage: ^10.3.4
  flutter_test:
    sdk: flutter
  edaya_integration_tests:
    path: ../../tooling/integration_tests
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../../branding/icons/teacher.png
  remove_alpha_ios: true
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: ../../branding/icons/teacher-foreground.png
  web:
    generate: true
    image_path: ../../branding/icons/teacher.png
    background_color: "#2563EB"
    theme_color: "#2563EB"

flutter:
  uses-material-design: true
