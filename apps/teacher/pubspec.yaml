name: edaya_teacher
description: Edaya mobile app for teachers and classroom workflows.
resolution: workspace
publish_to: none

version: 1.0.0+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  edaya_api_client:
    path: ../../packages/edaya_api_client
  edaya_auth:
    path: ../../packages/edaya_auth
  edaya_shared:
    path: ../../packages/edaya_shared
  levit_flutter: ^0.0.8
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.9
  firebase_core: ^4.11.0
  go_router: ^17.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  edaya_integration_tests:
    path: ../../tooling/integration_tests
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../../branding/icons/icon_teacher.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: ../../branding/icons/icon_teacher.png
  web:
    generate: true
    image_path: ../../branding/icons/icon_teacher.png
    background_color: "#F0F7FF"
    theme_color: "#2563EB"

flutter:
  uses-material-design: true
