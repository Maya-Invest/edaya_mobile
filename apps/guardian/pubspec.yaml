name: edaya_guardian
description: Edaya mobile app for guardians and parents.
publish_to: none
resolution: workspace

version: 1.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  edaya_api_client:
    path: ../../packages/edaya_api_client
  edaya_auth:
    path: ../../packages/edaya_auth
  edaya_shared:
    path: ../../packages/edaya_shared
  go_router: ^17.3.0
  intl: any
  levit_flutter: ^0.0.9
  shared_preferences: ^2.5.5
  firebase_core: ^4.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  edaya_integration_tests:
    path: ../../tooling/integration_tests
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
