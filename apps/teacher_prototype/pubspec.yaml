name: teacher_prototype
description: Teacher Accueil-first product surface — live OTP, context, avis, and daily tasks.
publish_to: none
resolution: workspace

version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  edaya_api_client:
    path: ../../packages/edaya_api_client
  edaya_auth:
    path: ../../packages/edaya_auth
  edaya_shared:
    path: ../../packages/edaya_shared
  go_router: ^17.3.0
  intl: any
  levit_flutter: ^0.0.9
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
