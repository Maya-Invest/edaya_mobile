name: guardian_prototype
description: Standalone Guardian UI prototype with mock data (design review).
publish_to: none
resolution: workspace

version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  intl: any
  levit_flutter: ^0.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: GalakRound
      fonts:
        - asset: assets/fonts/GalakRound-Demo.otf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
