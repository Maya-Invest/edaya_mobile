name: edaya_shared
description: Shared configuration, UI, and app scaffolding for Edaya mobile apps.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  timezone: ^0.11.1
  google_fonts: ^8.1.0
  edaya_api_client:
    path: ../edaya_api_client
  edaya_auth:
    path: ../edaya_auth
  levit_flutter: ^0.0.9
  shared_preferences: ^2.5.5
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  path: ^1.9.1
  path_provider: ^2.1.5
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  go_router: ^17.3.0
  http: ^1.6.0
  flutter_secure_storage: ^9.2.4
  image: ^4.5.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.4
  sqlite3: ^2.7.6

flutter:
  uses-material-design: true
  generate: true
