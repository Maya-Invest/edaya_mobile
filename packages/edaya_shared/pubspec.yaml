name: edaya_shared
description: Shared configuration, UI, and app scaffolding for Edaya mobile apps.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  timezone: ^0.10.0
  google_fonts: ^6.2.1
  edaya_api_client:
    path: ../edaya_api_client
  edaya_auth:
    path: ../edaya_auth
  levit_flutter: ^0.0.7
  shared_preferences: ^2.5.3
  firebase_core: ^4.11.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^19.0.0
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
