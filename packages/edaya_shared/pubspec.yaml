name: edaya_shared
description: Shared configuration, UI, and app scaffolding for EDaya mobile apps.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  timezone: ^0.11.1
  edaya_api_client:
    path: ../edaya_api_client
  edaya_auth:
    path: ../edaya_auth
  levit_flutter: ^0.0.9
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  file_picker: ^12.3.0
  sqflite: ^2.4.2
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  path: ^1.9.1
  path_provider: ^2.1.5
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  go_router: ^17.3.0
  http: ^1.6.0
  image: ^4.5.4
  image_picker: ^1.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.4
  sqlite3: ^2.7.6
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/demo/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Poppins-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
