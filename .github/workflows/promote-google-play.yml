name: Promote Google Play to production
on:
  workflow_dispatch:
    inputs:
      guardian_version_code:
        description: Guardian version code from a successful internal release
        required: true
        type: string
      teacher_version_code:
        description: Teacher version code from a successful internal release
        required: true
        type: string
permissions:
  contents: read
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: google-play-production
    concurrency:
      group: google-play-release-production
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
      - name: Authenticate Google Play production promoter
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Promote the selected tested versions without rebuilding
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PLAY_GUARDIAN_VERSION: ${{ inputs.guardian_version_code }}
          PLAY_TEACHER_VERSION: ${{ inputs.teacher_version_code }}
        run: dart run edaya_repo:play promote
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: play-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .release/play-promote.json
