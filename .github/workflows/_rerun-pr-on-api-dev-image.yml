name: Re-run PR CI on API dev image

on:
  workflow_call:
    inputs:
      channel:
        description: api-dev image channel (staging or production)
        required: false
        type: string
        default: ''

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Re-run CI for matching open pull requests
        uses: actions/github-script@v7
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const path = require('node:path')
            const { rerunPrCiOnApiDevImage } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/rerun-pr-on-api-dev-image.cjs'))
            await rerunPrCiOnApiDevImage({ github, context, core })
