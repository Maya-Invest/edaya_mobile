name: Deploy
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparation:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_prepare.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      source_ref: ${{ github.sha }}
      release_mode: true
    secrets:
      BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
  quality:
    needs: preparation
    uses: ./.github/workflows/_quality_check.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
  unit:
    needs: preparation
    uses: ./.github/workflows/_unit_test.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
  android:
    needs: preparation
    uses: ./.github/workflows/_build_android.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
  ios:
    needs: preparation
    uses: ./.github/workflows/_build_ios.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      IOS_SIGNING_BUNDLE: ${{ secrets.IOS_SIGNING_BUNDLE }}
  integration:
    needs: [preparation, quality, unit]
    uses: ./.github/workflows/_integration_test.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
  qualification:
    if: always()
    needs: [preparation, quality, unit, android, ios, integration]
    uses: ./.github/workflows/_finalize.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
      job_results: ${{ toJSON(needs) }}
  deploy:
    needs: [preparation, qualification]
    uses: ./.github/workflows/_deploy.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
