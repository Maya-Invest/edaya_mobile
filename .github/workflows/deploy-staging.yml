name: Mobile store releases
on:
  push:
    branches: [staging, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_qualify.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      source_ref: ${{ github.sha }}
    secrets: inherit
  deploy:
    needs: qualify
    uses: ./.github/workflows/_deploy.yml
    with:
      target: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    secrets: inherit
