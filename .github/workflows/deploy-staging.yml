name: Deploy staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source revision (empty uses selected workflow revision)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/_qualify.yml
    with:
      target: staging
      source_ref: ${{ inputs.source_ref || github.sha }}
    secrets: inherit
  deploy:
    if: vars.ENABLE_INDEPENDENT_RELEASES == 'true'
    needs: qualify
    uses: ./.github/workflows/_deploy.yml
    with:
      target: staging
    secrets: inherit
