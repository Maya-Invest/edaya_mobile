name: Resolve backend candidate

on:
  workflow_call:
    inputs:
      backend_ref:
        type: string
        default: ''
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: true
    outputs:
      backend_sha:
        description: Immutable backend commit shared by every integration job
        value: ${{ jobs.candidate.outputs.backend_sha }}

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend_sha: ${{ steps.resolve.outputs.backend_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Resolve once without fallback on access errors
        id: resolve
        env:
          BACKEND_REF: ${{ inputs.backend_ref }}
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          IDENTITY_CHECKOUT_TOKEN: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
        run: python3 .github/scripts/ci_support.py resolve
