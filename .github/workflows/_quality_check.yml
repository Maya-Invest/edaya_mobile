name: Quality checks
on:
  workflow_call:
    inputs:
      target: {type: string, required: true}
      source_sha: {type: string, required: true}
      backend_sha: {type: string, required: true}
      release_mode: {type: boolean, default: false}
permissions:
  contents: read
  actions: read
jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      TARGET: ${{ inputs.target }}
      CI_SOURCE_SHA: ${{ inputs.source_sha }}
      CI_BACKEND_SHA: ${{ inputs.backend_sha }}
      RELEASE_MODE: ${{ inputs.release_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: dart run edaya_repo:repo ci quality
      - uses: ./.github/actions/stage
        with:
          stage: quality
