name: Pull request
on:
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
  deployments: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  qualification:
    uses: ./.github/workflows/_qualify.yml
    with:
      target: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
      source_ref: ${{ github.sha }}
      baseline_sha: ${{ github.event.pull_request.base.sha }}
    secrets: inherit
