name: Full integration

on:
  workflow_call:
    inputs:
      backend_sha:
        type: string
        required: true
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [api, guardian, teacher]
    env:
      CI_BACKEND_SHA: ${{ inputs.backend_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-flutter-melos
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Checkout pinned backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/edaya_backend
          ref: ${{ inputs.backend_sha }}
          path: .ci/edaya_backend
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
          persist-credentials: false
      - name: Compare backend source and committed client contracts
        run: python3 .github/scripts/ci_support.py contract --backend .ci/edaya_backend
      - name: Link the unified backend fixture
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          test ! -e "$parent/edaya_backend"
          ln -s "$GITHUB_WORKSPACE/.ci/edaya_backend" "$parent/edaya_backend"
          test -f "$parent/edaya_backend/package/api-client/package.json"
          test -f "$parent/edaya_backend/apps/api/src/identity/entries/testing.ts"
      - name: Cache locked backend dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('.ci/edaya_backend/bun.lock') }}
      - name: Verify generated school and auth contracts against the pinned backend
        run: melos run generated:check
      - name: Start the unified fixture API and file service
        run: bash .github/scripts/ci-start-local-apis.sh start
      - name: Seed disposable demo accounts
        run: |
          parent="$(dirname "$GITHUB_WORKSPACE")"
          cd "$parent/edaya_backend"
          bun --no-env-file repo seed --skip-profile-photos --skip-attachments
      - name: Integration suite
        env:
          EDAYA_INTEGRATION_TESTS: '1'
          EDAYA_API_URL: http://127.0.0.1:9999
          SUITE: ${{ matrix.suite }}
        run: python3 scripts/integration-runner.py --suite "$SUITE"
      - name: Require complete current suite execution
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: python3 scripts/integration-runner.py --validate-only --suite "$SUITE"
      - name: Collect credential-free execution evidence
        if: always()
        run: python3 .github/scripts/ci_support.py evidence --role mobile
      - name: Upload sanitized summaries only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-integration-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stop owned fixture processes and remove credentials
        if: always()
        run: bash .github/scripts/ci-start-local-apis.sh stop
