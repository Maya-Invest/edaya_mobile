name: Integration tests

on:
  workflow_call:
    inputs:
      api_dev_base_ref:
        description: Base branch used to select the api-dev image channel
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Add pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start API dev container
        run: bash .github/scripts/ci-api-dev-container.sh start "${{ inputs.api_dev_base_ref }}"

      - name: Integration tests
        env:
          EDAYA_INTEGRATION_TESTS: '1'
          INTEGRATION_TARGET: staging
          EDAYA_API_URL: http://127.0.0.1:9999
        run: melos run test:integration

      - name: Stop API dev container
        if: always()
        run: bash .github/scripts/ci-api-dev-container.sh stop
