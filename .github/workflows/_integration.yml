name: Integration tests

on:
  workflow_call:
    secrets:
      IDENTITY_CHECKOUT_TOKEN:
        required: true

permissions:
  actions: write
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [api, guardian, teacher]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ github.job }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Resolve API source ref
        id: api_source
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          HEAD="$CANDIDATE_REF"
          REF="$(bash .github/scripts/ci-api-source-ref.sh "$HEAD")"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Using Identity + school @${REF} (mobile head ${HEAD})"

      - name: Assert Identity and school refs exist
        env:
          IDENTITY_CHECKOUT_TOKEN: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}
        run: bash .github/scripts/ci-assert-sibling-ref.sh "${{ steps.api_source.outputs.ref }}"

      - name: Checkout school
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/edaya_backend
          ref: ${{ steps.api_source.outputs.ref }}
          path: .ci/edaya_backend
          token: ${{ secrets.IDENTITY_CHECKOUT_TOKEN }}

      - name: Link sibling checkouts
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          rm -rf "$parent/edaya_backend"
          ln -sfn "$GITHUB_WORKSPACE/.ci/edaya_backend" "$parent/edaya_backend"
          test -f "$parent/edaya_backend/package/identity-client/package.json"
          test -f "$parent/edaya_backend/package.json"

      - name: Start empty Identity and school
        run: bash .github/scripts/ci-start-local-apis.sh start

      - name: Seed demo-ci
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          if ! (cd "$parent/edaya_backend" && bun repo seed --skip-profile-photos --skip-attachments); then
            echo "--- identity.log ---" >&2
            cat /tmp/edaya-ci-apis/identity.log >&2 || true
            echo "--- school.log ---" >&2
            cat /tmp/edaya-ci-apis/school.log >&2 || true
            exit 1
          fi

      - name: Setup Flutter, Melos, and caches
        uses: ./.github/actions/ci-flutter-melos

      - name: Integration tests
        env:
          EDAYA_INTEGRATION_TESTS: '1'
          EDAYA_AUTH_URL: http://127.0.0.1:9900
          EDAYA_API_URL: http://127.0.0.1:9999
        run: python3 scripts/integration-runner.py --suite "${{ matrix.suite }}"

      - name: Validate integration results
        if: always()
        run: python3 scripts/integration-runner.py --validate-only --suite "${{ matrix.suite }}"

      - name: Publish integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-integration-${{ matrix.suite }}
          path: .integration-results/
          include-hidden-files: true
          if-no-files-found: error

      - name: Stop Identity and school
        if: always()
        run: bash .github/scripts/ci-start-local-apis.sh stop
