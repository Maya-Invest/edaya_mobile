name: Integration tests
on:
  workflow_call:
    inputs:
      target: {type: string, required: true}
      source_sha: {type: string, required: true}
      backend_sha: {type: string, required: true}
      release_mode: {type: boolean, default: false}
      baseline_sha: {type: string, default: ''}
    secrets:
      BACKEND_CHECKOUT_TOKEN: {required: false}
permissions:
  contents: read
  actions: read
jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: 'true'
      TARGET: ${{ inputs.target }}
      CI_SOURCE_SHA: ${{ inputs.source_sha }}
      CI_BACKEND_SHA: ${{ inputs.backend_sha }}
      RELEASE_MODE: ${{ inputs.release_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Maya-Invest/edaya_backend
          ref: ${{ inputs.backend_sha }}
          path: .ci/edaya_backend
          token: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
          persist-credentials: false
      - name: Run API, Guardian and Teacher suites
        env:
          COMPATIBILITY_BASE_SHA: ${{ inputs.baseline_sha }}
        run: dart run edaya_repo:repo ci integration
      - name: Save integration diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .ci-evidence/results.json
            .ci-evidence/backend-services.json
            .integration-results/*.json*
      - uses: ./.github/actions/stage
        with:
          stage: integration
