name: Submit TestFlight builds to App Store
on:
  workflow_dispatch:
    inputs:
      guardian_version:
        description: Guardian marketing version tested in TestFlight (e.g. 1.0.0)
        required: true
        type: string
      guardian_build:
        description: Guardian build number from the Apple release summary
        required: true
        type: string
      teacher_version:
        description: Teacher marketing version tested in TestFlight (e.g. 1.0.0)
        required: true
        type: string
      teacher_build:
        description: Teacher build number from the Apple release summary
        required: true
        type: string
      automatic_release:
        description: Release publicly once Apple approves (otherwise release manually in App Store Connect)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: app-store-production
    concurrency:
      group: apple-release-production
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tooling/apple
      - name: Submit the selected processed builds for App Review
        working-directory: tooling/apple
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          APPLE_GUARDIAN_VERSION: ${{ inputs.guardian_version }}
          APPLE_GUARDIAN_BUILD: ${{ inputs.guardian_build }}
          APPLE_TEACHER_VERSION: ${{ inputs.teacher_version }}
          APPLE_TEACHER_BUILD: ${{ inputs.teacher_build }}
          APPLE_AUTOMATIC_RELEASE: ${{ inputs.automatic_release }}
        run: bundle exec fastlane ios submit
      - name: Upload App Store submission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apple-submission-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .release/apple-submission.json
