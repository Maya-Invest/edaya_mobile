name: Unit verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-flutter-melos
      - name: Validate workflow definitions
        run: bash .github/scripts/lint-workflows.sh
      - name: Verify all unit and tooling tests
        run: melos run verify
