name: Verify

on:
  workflow_call:

permissions:
  actions: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter, Melos, and caches
        uses: ./.github/actions/ci-flutter-melos

      - name: Verify
        run: melos run verify
