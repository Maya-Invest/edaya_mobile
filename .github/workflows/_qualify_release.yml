name: _Qualify signed mobile builds
on:
  workflow_call:
    inputs:
      target: {type: string, required: true}
    secrets:
      BACKEND_CHECKOUT_TOKEN: {required: true}
      ANDROID_SIGNING_BUNDLE: {required: false}
      IOS_SIGNING_BUNDLE: {required: false}
    outputs:
      backend_sha:
        description: Backend revision used to qualify the signed builds.
        value: ${{ jobs.preparation.outputs.backend_sha }}
permissions:
  contents: read
  actions: read
  deployments: write
jobs:
  preparation:
    uses: ./.github/workflows/_prepare.yml
    with:
      target: ${{ inputs.target }}
      source_ref: ${{ github.sha }}
      release_mode: true
    secrets:
      BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
  quality:
    needs: preparation
    uses: ./.github/workflows/_quality_check.yml
    with:
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
  unit:
    needs: preparation
    uses: ./.github/workflows/_unit_test.yml
    with:
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
  android_guardian:
    name: Build Guardian Android
    needs: preparation
    uses: ./.github/workflows/_build_android.yml
    with:
      app: guardian
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
  android_teacher:
    name: Build Teacher Android
    needs: preparation
    uses: ./.github/workflows/_build_android.yml
    with:
      app: teacher
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
  ios_guardian:
    name: Build Guardian iOS
    needs: preparation
    uses: ./.github/workflows/_build_ios.yml
    with:
      app: guardian
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      IOS_SIGNING_BUNDLE: ${{ secrets.IOS_SIGNING_BUNDLE }}
  ios_teacher:
    name: Build Teacher iOS
    needs: preparation
    uses: ./.github/workflows/_build_ios.yml
    with:
      app: teacher
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      IOS_SIGNING_BUNDLE: ${{ secrets.IOS_SIGNING_BUNDLE }}
  integration_api:
    name: API integration
    needs: [preparation, quality, unit]
    uses: ./.github/workflows/_integration_test.yml
    with:
      suite: api
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
  integration_guardian_v2:
    name: Guardian integration
    needs: [preparation, quality, unit]
    uses: ./.github/workflows/_integration_test.yml
    with:
      suite: guardian_v2
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
  integration_teacher_v2:
    name: Teacher integration
    needs: [preparation, quality, unit]
    uses: ./.github/workflows/_integration_test.yml
    with:
      suite: teacher_v2
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
    secrets:
      BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
  qualification:
    if: always()
    needs: [preparation, quality, unit, android_guardian, android_teacher, ios_guardian, ios_teacher, integration_api, integration_guardian_v2, integration_teacher_v2]
    uses: ./.github/workflows/_finalize.yml
    with:
      target: ${{ inputs.target }}
      source_sha: ${{ needs.preparation.outputs.source_sha }}
      backend_sha: ${{ needs.preparation.outputs.backend_sha }}
      release_mode: true
      job_results: ${{ toJSON(needs) }}
