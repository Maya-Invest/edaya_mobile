name: CI

on:
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:
    inputs:
      pr_base_ref:
        description: Pull request base branch (selects api-dev image channel)
        required: false
        default: staging
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Add pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Verify
        run: melos run verify

  integration:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_DEV_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.inputs.pr_base_ref || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Add pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start API dev container
        run: bash .github/scripts/ci-api-dev-container.sh start "${{ env.API_DEV_BASE_REF }}"

      - name: Integration tests
        env:
          EDAYA_INTEGRATION_TESTS: '1'
          INTEGRATION_TARGET: staging
          EDAYA_API_URL: http://127.0.0.1:9999
        run: melos run test:integration

      - name: Stop API dev container
        if: always()
        run: bash .github/scripts/ci-api-dev-container.sh stop
