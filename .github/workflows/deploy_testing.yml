name: Deploy testing
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: mobile-store-release
  queue: max
jobs:
  qualification:
    if: github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/_qualify_release.yml
    with:
      target: staging
    secrets:
      BACKEND_CHECKOUT_TOKEN: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
      ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
      IOS_SIGNING_BUNDLE: ${{ secrets.IOS_SIGNING_BUNDLE }}

  google_play:
    name: Google Play internal testing
    needs: qualification
    uses: ./.github/workflows/_publish_play.yml
    with:
      target: staging
      backend_sha: ${{ needs.qualification.outputs.backend_sha }}
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

  testflight:
    name: TestFlight / ${{ matrix.app }}
    needs: qualification
    strategy:
      fail-fast: false
      matrix:
        app: [guardian, teacher]
    runs-on: macos-15
    environment: staging
    timeout-minutes: 180
    env:
      TARGET: staging
      MOBILE_APP: ${{ matrix.app }}
      CI_SOURCE_SHA: ${{ github.sha }}
      CI_BACKEND_SHA: ${{ needs.qualification.outputs.backend_sha }}
      RELEASE_MODE: 'true'
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/upload-ios
        with:
          api-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
