name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source revision (empty uses selected workflow revision)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/_qualify.yml
    with:
      target: production
      source_ref: ${{ inputs.source_ref || github.sha }}
    secrets: inherit
  deploy:
    needs: qualify
    uses: ./.github/workflows/_deploy.yml
    with:
      target: production
    secrets: inherit
