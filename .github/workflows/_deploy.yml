name: Publish qualified mobile releases
on:
  workflow_call:
    inputs:
      platform: {type: string, required: true}
      app: {type: string, required: true}
      phase: {type: string, required: true}
      target: {type: string, required: true}
      source_sha: {type: string, required: true}
      backend_sha: {type: string, required: true}
      release_mode: {type: boolean, default: false}
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: {required: false}
      APP_STORE_CONNECT_API_KEY_JSON: {required: false}
permissions:
  contents: read
  actions: read
  deployments: write
jobs:
  publish:
    name: ${{ inputs.app }} / ${{ inputs.phase }}
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-24.04' }}
    environment: ${{ inputs.target }}
    timeout-minutes: 180
    env:
      CI: 'true'
      MOBILE_APP: ${{ inputs.app }}
      PLATFORM: ${{ inputs.platform }}
      PHASE: ${{ inputs.phase }}
      TARGET: ${{ inputs.target }}
      CI_SOURCE_SHA: ${{ inputs.source_sha }}
      CI_BACKEND_SHA: ${{ inputs.backend_sha }}
      RELEASE_MODE: ${{ inputs.release_mode }}
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - name: Validate publication inputs
        run: |
          case "$MOBILE_APP" in guardian|teacher) ;; *) exit 1 ;; esac
          case "$PLATFORM/$PHASE" in
            android/prepare|android/publish|ios/upload) ;;
            ios/submit) test "$TARGET" = production ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stage-${{ inputs.platform }}_${{ inputs.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/
      - name: Verify qualified app artifacts
        run: dart run edaya_repo:repo ci verify-publication "$PLATFORM" "$TARGET"
      - name: Restore prepared Play edit
        if: inputs.phase == 'publish'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: play-edit-${{ inputs.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/${{ inputs.app }}/
      - name: Authenticate Google Play publisher
        if: inputs.platform == 'android'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Stage bundle and check Play track
        if: inputs.phase == 'prepare'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: dart run edaya_repo:play "$TARGET" prepare
      - name: Save prepared Play edit
        if: inputs.phase == 'prepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: play-edit-${{ inputs.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/${{ inputs.app }}/play-edit.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Commit qualified Play edit
        if: inputs.phase == 'publish'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: dart run edaya_repo:play "$TARGET" commit
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        if: inputs.platform == 'ios'
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tooling/apple
      - name: Restore processed TestFlight build
        if: inputs.phase == 'submit'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: receipts-ios-${{ inputs.app }}-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/${{ inputs.app }}/
      - name: Upload IPA and wait for processing
        if: inputs.phase == 'upload'
        working-directory: tooling/apple
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: bundle exec fastlane ios upload_beta
      - name: Check processed build is eligible for App Review
        if: inputs.phase == 'upload' && inputs.target == 'production'
        working-directory: tooling/apple
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: bundle exec fastlane ios check_review
      - name: Submit processed build to App Review
        if: inputs.phase == 'submit'
        working-directory: tooling/apple
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: bundle exec fastlane ios submit
      - name: Retain publication receipt
        if: always() && inputs.phase != 'prepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: receipts-${{ inputs.platform }}-${{ inputs.app }}-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          path: .release/${{ inputs.app }}/${{ inputs.phase == 'publish' && format('play-{0}.json', inputs.target) || inputs.phase == 'submit' && 'apple-submission.json' || 'apple-testflight.json' }}
