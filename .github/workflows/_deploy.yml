name: Publish qualified mobile releases
on:
  workflow_call:
    inputs:
      target: {type: string, required: true}
      source_sha: {type: string, required: true}
      backend_sha: {type: string, required: true}
      release_mode: {type: boolean, default: false}
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: {required: false}
      APP_STORE_CONNECT_API_KEY_JSON: {required: false}
permissions:
  contents: read
  actions: read
  deployments: write
jobs:
  android:
    name: Google Play publication
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    concurrency:
      group: google-play-release
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      CI: 'true'
      TARGET: ${{ inputs.target }}
      CI_SOURCE_SHA: ${{ inputs.source_sha }}
      CI_BACKEND_SHA: ${{ inputs.backend_sha }}
      RELEASE_MODE: ${{ inputs.release_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stage-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/
      - name: Verify qualified android files
        run: dart run edaya_repo:repo ci verify-publication android "$TARGET"
      - name: Authenticate Google Play publisher
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish qualified bundles
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: dart run edaya_repo:play "$TARGET"
      - name: Retain per-app receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: receipts-android-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .release/play-*.json
  ios:
    name: Apple publication
    runs-on: macos-15
    environment: ${{ inputs.target }}
    concurrency:
      group: apple-release-${{ inputs.target }}
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      CI: 'true'
      TARGET: ${{ inputs.target }}
      CI_SOURCE_SHA: ${{ inputs.source_sha }}
      CI_BACKEND_SHA: ${{ inputs.backend_sha }}
      RELEASE_MODE: ${{ inputs.release_mode }}
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stage-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/
      - name: Verify qualified ios files
        run: dart run edaya_repo:repo ci verify-publication ios "$TARGET"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tooling/apple
      - name: Upload both IPAs to TestFlight
        working-directory: tooling/apple
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: bundle exec fastlane ios upload_beta
      - name: Submit production builds for App Review
        if: inputs.target == 'production'
        working-directory: tooling/apple
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: bundle exec fastlane ios submit
      - name: Retain per-app receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: receipts-ios-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .release/apple-testflight.json
            .release/apple-submission.json
