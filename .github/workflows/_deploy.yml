name: Deploy qualified artifacts
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: google-play-release-${{ inputs.target }}
      cancel-in-progress: false
    environment: ${{ inputs.target }}
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target }}
      PLAY_VERSION_CODE_BASE: ${{ vars.PLAY_VERSION_CODE_BASE || '1000000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore exact qualified source and artifacts
        run: dart tooling/repo/bin/restore.dart
      - run: dart pub get --enforce-lockfile
      - name: Build signed artifacts
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: dart run edaya_repo:repo ci deploy "$TARGET"
      - name: Authenticate Google Play publisher
        if: inputs.target == 'production'
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Release both apps to Google Play internal testing
        if: inputs.target == 'production'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
        run: dart run edaya_repo:play internal
      - name: Upload release evidence and artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .release/
      - name: Remove restored signing credentials
        if: always()
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: dart run edaya_repo:repo ci signing-cleanup
  apple:
    name: Build iOS and upload to TestFlight
    if: inputs.target == 'production'
    runs-on: macos-15
    environment: production
    concurrency:
      group: apple-release-production
      cancel-in-progress: false
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Restore exact qualified source and generated client
        run: dart tooling/repo/bin/restore.dart
      - run: dart pub get --enforce-lockfile
      - name: Verify qualified production inputs
        run: dart run edaya_repo:apple
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tooling/apple
      - name: Check Apple release tooling
        working-directory: tooling/apple
        run: bundle exec ruby test/release_test.rb
      - name: Build and verify signed v2 IPAs
        working-directory: tooling/apple
        env:
          IOS_SIGNING_BUNDLE: ${{ secrets.IOS_SIGNING_BUNDLE }}
        run: bundle exec fastlane ios build
      - name: Upload both apps to TestFlight
        working-directory: tooling/apple
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: bundle exec fastlane ios upload_beta
      - name: Upload Apple release evidence and IPAs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-apple-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .release/apple-*.json
            .release/ios/*.ipa
