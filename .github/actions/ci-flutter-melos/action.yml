name: Setup Flutter, Melos, and caches
description: Installs Flutter with SDK and pub caches, caches the Melos global tool, and bootstraps the workspace.

inputs:
  channel:
    description: Flutter release channel
    required: false
    default: stable
  bootstrap:
    description: Run melos bootstrap after setup
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        package-manager-cache: false

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: ${{ inputs.channel }}
        flutter-version: 3.44.8
        cache: true
        pub-cache: true
        pub-cache-key: flutter-pub-${{ runner.os }}-${{ inputs.channel }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'apps/**/pubspec.yaml', 'packages/**/pubspec.yaml', 'tooling/**/pubspec.yaml') }}

    - name: Cache Melos global
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: melos_global_cache
      with:
        path: |
          ~/.pub-cache/bin
          ~/.pub-cache/global_packages
          ~/.pub-cache/activated_package
        key: melos-global-${{ runner.os }}-3.44.8-8.0.0-${{ hashFiles('pubspec.lock') }}
        restore-keys: |
          melos-global-${{ runner.os }}-3.44.8-8.0.0-

    - name: Install Melos
      shell: bash
      run: |
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.pub-cache/bin:$PATH"
        dart pub global activate melos 8.0.0

    - name: Bootstrap workspace
      if: inputs.bootstrap == 'true'
      shell: bash
      run: |
        dart pub get --enforce-lockfile
        melos bootstrap
        git diff --exit-code -- pubspec.lock
