name: Restore qualified app artifacts
description: Restore this app's build and qualification report from the current attempt.
inputs:
  platform:
    description: Platform of the qualified app build.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: stage-${{ inputs.platform }}_${{ env.MOBILE_APP }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualified-${{ github.run_id }}-${{ github.run_attempt }}
        path: .ci-evidence/
